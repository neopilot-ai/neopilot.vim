name: Version Tag

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to create'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
        - prerelease
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false
        type: string
      create_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  version:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      created: ${{ steps.version.outputs.created }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: current_version
      run: |
        # Try to get version from VERSION file first, then fall back to git tags
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION | tr -d '\n')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Found version in VERSION file: $CURRENT_VERSION"
        elif git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1; then
          CURRENT_VERSION=$(git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Found current version from git tags: $CURRENT_VERSION"
        else
          echo "current_version=0.0.0" >> $GITHUB_OUTPUT
          echo "No existing version found, starting from 0.0.0"
        fi

    - name: Determine new version
      id: version
      run: |
        CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
        VERSION_TYPE="${{ github.event.inputs.version_type || 'patch' }}"
        CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

        if [ -n "$CUSTOM_VERSION" ]; then
          # Use custom version if provided
          NEW_VERSION="$CUSTOM_VERSION"
          echo "Using custom version: $NEW_VERSION"
        else
          # Calculate semantic version bump
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          case $VERSION_TYPE in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
            prerelease)
              # Check if current version is already a prerelease
              if [[ $CURRENT_VERSION == *-* ]]; then
                # Increment prerelease number
                BASE_VERSION=$(echo $CURRENT_VERSION | cut -d- -f1)
                PRERELEASE=$(echo $CURRENT_VERSION | cut -d- -f2)
                if [[ $PRERELEASE =~ ^[0-9]+$ ]]; then
                  NEW_VERSION="$BASE_VERSION-$((PRERELEASE + 1))"
                else
                  NEW_VERSION="$BASE_VERSION-1"
                fi
              else
                NEW_VERSION="$CURRENT_VERSION-1"
              fi
              ;;
            *)
              echo "Invalid version type: $VERSION_TYPE"
              exit 1
              ;;
          esac
          echo "Calculated new version: $NEW_VERSION (type: $VERSION_TYPE)"
        fi

        TAG_NAME="v$NEW_VERSION"

        # Check if tag already exists
        if git tag -l | grep -q "^$TAG_NAME$"; then
          echo "Tag $TAG_NAME already exists"
          echo "created=false" >> $GITHUB_OUTPUT
        else
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "created=true" >> $GITHUB_OUTPUT
          echo "Creating new tag: $TAG_NAME"
        fi

  tag:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create and push tag
      run: |
        TAG_NAME="${{ needs.version.outputs.tag_name }}"
        NEW_VERSION="${{ needs.version.outputs.new_version }}"

        echo "Creating tag: $TAG_NAME for version $NEW_VERSION"

        # Update VERSION file
        echo "$NEW_VERSION" > VERSION

        # Add VERSION file to git
        git add VERSION

        # Commit the version update
        git commit -m "Bump version to $NEW_VERSION" || echo "No changes to commit"

        # Create annotated tag with version info
        git tag -a "$TAG_NAME" -m "Release version $NEW_VERSION"

        # Push the commit and tag
        git push origin main
        git push origin "$TAG_NAME"

        echo "Successfully created and pushed tag: $TAG_NAME"

  release:
    needs: [version, tag]
    if: needs.version.outputs.created == 'true' && github.event.inputs.create_release == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        release_name: Release ${{ needs.version.outputs.new_version }}
        body: |
          ## Release ${{ needs.version.outputs.new_version }}

          ${{ github.event.inputs.release_notes || 'Automated release created via GitHub Actions.' }}

          ### Changes
          - Version bump to ${{ needs.version.outputs.new_version }}
          - Tag: ${{ needs.version.outputs.tag_name }}

          For a complete list of changes, see the [commit history](https://github.com/${{ github.repository }}/commits/${{ needs.version.outputs.tag_name }}).
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, '-') }}