name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: nightly

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gzip

    - name: Validate Lua syntax
      run: |
        find lua -name "*.lua" -exec lua -e "print('Checking: {}'); dofile('{}')" \;

    - name: Run health check
      run: |
        nvim --headless -c "lua require('neopilot.health').check()" -c "qa"

    - name: Run tests
      run: |
        nvim --headless -c "lua require('neopilot.test').run_all()" -c "qa"

    - name: Validate Vimscript syntax
      run: |
        nvim --headless -c "source plugin/neopilot.vim" -c "qa"

  release-validation:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Validate version consistency
      run: |
        VERSION_FILE=$(cat VERSION)
        TAG_NAME=${GITHUB_REF#refs/tags/}
        if [ "$VERSION_FILE" != "$TAG_NAME" ]; then
          echo "Version mismatch: VERSION file has $VERSION_FILE, tag is $TAG_NAME"
          exit 1
        fi

    - name: Validate changelog
      run: |
        if ! grep -q "$TAG_NAME" CHANGELOG.md; then
          echo "Version $TAG_NAME not found in CHANGELOG.md"
          exit 1
        fi