# Copybara import generated

name: Auto Version Tag

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]

jobs:
  version-check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      should_tag: ${{ steps.check.outputs.should_tag }}
      version_type: ${{ steps.check.outputs.version_type }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for conventional commits
      id: check
      run: |
        # Get the latest commit message
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # For merged PRs, check the merge commit or PR title
          COMMIT_MSG="${{ github.event.pull_request.title }}"
        else
          # For direct pushes, check the latest commit
          COMMIT_MSG=$(git log -1 --pretty=%B)
        fi

        echo "Commit message: $COMMIT_MSG"

        # Check for conventional commit patterns
        if echo "$COMMIT_MSG" | grep -qE "^(feat|fix|perf|refactor|style|test|docs|build|ci|chore|revert)(\(.+\))?!:"; then
          echo "Found conventional commit"

          # Determine version bump type
          if echo "$COMMIT_MSG" | grep -qE "^(feat|perf|refactor)(\(.+\))?!:"; then
            # Breaking changes (indicated by !) or major features
            if echo "$COMMIT_MSG" | grep -q "!:"; then
              VERSION_TYPE="major"
              echo "Breaking change detected - major version bump"
            else
              VERSION_TYPE="minor"
              echo "New feature detected - minor version bump"
            fi
          elif echo "$COMMIT_MSG" | grep -qE "^fix(\(.+\))?!:"; then
            VERSION_TYPE="patch"
            echo "Bug fix detected - patch version bump"
          else
            VERSION_TYPE="patch"
            echo "Other conventional commit - patch version bump"
          fi

          echo "should_tag=true" >> $GITHUB_OUTPUT
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
        else
          echo "No conventional commit detected - skipping auto-tagging"
          echo "should_tag=false" >> $GITHUB_OUTPUT
          echo "version_type=patch" >> $GITHUB_OUTPUT
        fi

  create-tag:
    needs: version-check
    if: needs.version-check.outputs.should_tag == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: current_version
      run: |
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION | tr -d '\n')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        elif git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1; then
          CURRENT_VERSION=$(git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        else
          echo "current_version=0.0.0" >> $GITHUB_OUTPUT
        fi

    - name: Calculate new version
      id: new_version
      run: |
        CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
        VERSION_TYPE="${{ needs.version-check.outputs.version_type }}"

        echo "Current version: $CURRENT_VERSION"
        echo "Version bump type: $VERSION_TYPE"

        # Parse current version
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR="${VERSION_PARTS[0]}"
        MINOR="${VERSION_PARTS[1]}"
        PATCH="${VERSION_PARTS[2]}"

        # Calculate new version
        case $VERSION_TYPE in
          major)
            NEW_VERSION="$((MAJOR + 1)).0.0"
            ;;
          minor)
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
            ;;
          patch)
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            ;;
        esac

        TAG_NAME="v$NEW_VERSION"

        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Check if tag exists
      id: tag_check
      run: |
        TAG_NAME="${{ steps.new_version.outputs.tag_name }}"
        if git tag -l | grep -q "^$TAG_NAME$"; then
          echo "Tag $TAG_NAME already exists - skipping"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "Tag $TAG_NAME does not exist - creating"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: steps.tag_check.outputs.exists == 'false'
      run: |
        TAG_NAME="${{ steps.new_version.outputs.tag_name }}"
        NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
        VERSION_TYPE="${{ needs.version-check.outputs.version_type }}"

        echo "Creating tag: $TAG_NAME for version $NEW_VERSION"

        # Update VERSION file
        echo "$NEW_VERSION" > VERSION

        # Add VERSION file to git
        git add VERSION

        # Commit the version update
        git commit -m "Bump version to $NEW_VERSION [auto]" || echo "No changes to commit"

        # Create annotated tag
        git tag -a "$TAG_NAME" -m "Auto-release $NEW_VERSION

        Triggered by $VERSION_TYPE change.
        Commit: ${{ github.sha }}"

        # Push the commit and tag
        git push origin main
        git push origin "$TAG_NAME"

        echo "Successfully created and pushed tag: $TAG_NAME"